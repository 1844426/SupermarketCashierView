<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cashier Register (Laptop)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-top: 0; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        button { padding: 10px 15px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; background: #007bff; color: white; }
        button:hover { background: #0056b3; }
        button.success { background: #28a745; }
        button.danger { background: #dc3545; }
        button.warning { background: #ffc107; color: #333; }
        .cart-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .cart-table th, .cart-table td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        .cart-table th { background: #f8f9fa; }
        .total-section { font-size: 22px; font-weight: bold; text-align: right; margin-bottom: 20px; }
        .wizard-box { background: #e9ecef; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: none; }
        .wizard-step { margin-bottom: 15px; }
        .wizard-step input { padding: 8px; width: 100%; max-width: 400px; box-sizing: border-box; }
        #wizImgPreview { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; display: block; margin-top: 5px; border: 1px solid #ccc; }
        .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 5% auto; padding: 20px; width: 80%; max-width: 600px; border-radius: 8px; max-height: 85vh; overflow-y: auto; text-align: center; }
        .memory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 15px; text-align: left; }
        .memory-card { border: 1px solid #ddd; padding: 10px; border-radius: 6px; background: #fafafa; text-align: center; }
        .memory-card img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛒 Cashier Register (Laptop)</h1>
    <div class="controls">
        <button class="warning" onclick="triggerPhoneAdd()">➕ Add Item</button>
        <button class="warning" onclick="openMemoryModal()">📂 Memory (Items)</button>
        <button class="warning" onclick="openCardNumbersModal()">💳 Card Numbers</button>
        <button class="success" onclick="nextScreen()">Move to Payment Screen</button>
        <button class="danger" onclick="resetRegister()">Reset Register</button>
    </div>

    <div class="wizard-box" id="wizardBox">
        <h3>Step-by-Step Item Creator</h3>
        <div class="wizard-step">
            <label>Scanned Product Photo (from Phone)</label>
            <img id="wizImgPreview" src="" alt="Pending photo">
        </div>
        <div class="wizard-step">
            <label>Title of Product</label>
            <input type="text" id="wizName" placeholder="e.g., Toy Car">
        </div>
        <div class="wizard-step">
            <label>Price ($)</label>
            <input type="number" id="wizPrice" placeholder="4.99" step="0.01">
        </div>
        <button class="success" onclick="saveWizardItem()">Save Item Forever</button>
        <button onclick="closeWizard()">Cancel</button>
    </div>

    <h3>Current Cart (Synced Live)</h3>
    <table class="cart-table">
        <thead>
            <tr><th>Image</th><th>Item Name</th><th>Price</th><th>Action</th></tr>
        </thead>
        <tbody id="cartItemsList"></tbody>
    </table>
    <div class="total-section">Total: $<span id="cartTotal">0.00</span></div>
</div>

<div class="modal" id="memoryModal">
    <div class="modal-content">
        <h2>Permanent Item Memory</h2>
        <div class="memory-grid" id="memoryGrid"></div>
        <br><button class="danger" onclick="deleteSelectedMemory()">Delete Selected</button>
        <button onclick="closeMemoryModal()">Close</button>
    </div>
</div>

<div class="modal" id="cardNumbersModal">
    <div class="modal-content" style="width: 50%; max-width: 400px;">
        <h2>Registered Cards</h2>
        <ul id="cardListContainer" style="list-style: none; padding: 0; text-align: left; max-height: 150px; overflow-y: auto;"></ul>
        <br><button class="danger" onclick="deleteSelectedCards()">Delete Selected</button>
        <button onclick="closeCardNumbersModal()">Close</button>
    </div>
</div>

<div class="modal" id="approvalModal">
    <div class="modal-content" style="width: 50%; max-width: 400px;">
        <h2>Card Registration Request</h2>
        <p>Customer wants to register card number: <strong id="pendingCardNum"></strong></p>
        <button class="success" onclick="approveCard()">Approve</button>
        <button class="danger" onclick="disapproveCard()">Disapprove</button>
    </div>
</div>

<script>
    const BIN_ID = "6af0c856ffd5d16053b19aac";
    const API_KEY = "$2a$10$kxSBPv9NfutB.zoBny1g.5BjiDXXe6P3mSm/3yebuzo8RXmdYlR6";

    let cloudData = { shopCart: [], shopInventory: [], registeredCards: ["12345"] };
    let pendingPhotoData = "";
    let lastProcessedScanId = 0;

    async function fetchCloud() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { "X-Master-Key": API_KEY }
            });
            const json = await res.json();
            cloudData = json.record;
            updateDisplay();
            checkCardRequests();
            checkScans();
        } catch (e) { console.error("Fetch error:", e); }
    }

    async function saveCloud() {
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
                body: JSON.stringify(cloudData)
            });
        } catch (e) { console.error("Save error:", e); }
    }

    function updateDisplay() {
        if (!cloudData.shopCart) return;
        const cartList = document.getElementById('cartItemsList');
        cartList.innerHTML = '';
        let total = 0;

        cloudData.shopCart.forEach((item, index) => {
            total += item.price;
            cartList.innerHTML += `
                <tr>
                    <td><img src="${item.img}" width="40" height="40" style="object-fit:cover; border-radius:4px;"></td>
                    <td>${item.name}</td>
                    <td>$${item.price.toFixed(2)}</td>
                    <td><button class="danger" onclick="removeItem(${index})">Remove</button></td>
                </tr>`;
        });
        document.getElementById('cartTotal').innerText = total.toFixed(2);
    }

    async function triggerPhoneAdd() {
        if (!cloudData.phoneAction) cloudData.phoneAction = {};
        cloudData.phoneAction = { action: 'add_request', timestamp: Date.now() };
        await saveCloud();
        alert("Signal sent to phone scanner!");
    }

    function checkScans() {
        if (!cloudData.incomingScans || cloudData.incomingScans.length === 0) return;
        let latest = cloudData.incomingScans[cloudData.incomingScans.length - 1];
        if (latest.id > lastProcessedScanId) {
            lastProcessedScanId = latest.id;
            let found = (cloudData.shopInventory || []).find(i => i.name.toLowerCase() === latest.name.toLowerCase());
            if (found) {
                if (!cloudData.shopCart) cloudData.shopCart = [];
                cloudData.shopCart.push(found);
                saveCloud();
            } else {
                alert("Product not found! Opening wizard.");
                pendingPhotoData = latest.img;
                document.getElementById('wizImgPreview').src = pendingPhotoData;
                document.getElementById('wizName').value = '';
                document.getElementById('wizPrice').value = '';
                document.getElementById('wizardBox').style.display = 'block';
            }
        }
    }

    async function removeItem(index) {
        cloudData.shopCart.splice(index, 1);
        await saveCloud();
        updateDisplay();
    }

    async function nextScreen() {
        cloudData.checkoutStep = 'payment';
        await saveCloud();
        alert("Moved customer tablet screen to payment!");
    }

    async function resetRegister() {
        cloudData.shopCart = [];
        cloudData.checkoutStep = 'shopping';
        cloudData.cardStatus = null;
        cloudData.cardApprovalRequest = null;
        await saveCloud();
        alert("Register reset!");
    }

    function closeWizard() { document.getElementById('wizardBox').style.display = 'none'; }

    async function saveWizardItem() {
        const name = document.getElementById('wizName').value.trim();
        const price = parseFloat(document.getElementById('wizPrice').value);
        if (!name || isNaN(price)) { alert("Enter valid name and price!"); return; }

        const newItem = { id: Date.now(), name, price, img: pendingPhotoData || "https://via.placeholder.com/80" };
        if (!cloudData.shopInventory) cloudData.shopInventory = [];
        cloudData.shopInventory.push(newItem);
        if (!cloudData.shopCart) cloudData.shopCart = [];
        cloudData.shopCart.push(newItem);

        await saveCloud();
        closeWizard();
        alert("Saved item!");
    }

    function openMemoryModal() {
        const grid = document.getElementById('memoryGrid');
        grid.innerHTML = '';
        (cloudData.shopInventory || []).forEach((item, index) => {
            grid.innerHTML += `<div class="memory-card"><input type="checkbox" class="memory-checkbox" value="${index}" id="mem_${index}"><label for="mem_${index}"><img src="${item.img}"><br><strong>${item.name}</strong><br>$${item.price.toFixed(2)}</label></div>`;
        });
        document.getElementById('memoryModal').style.display = 'block';
    }
    function closeMemoryModal() { document.getElementById('memoryModal').style.display = 'none'; }
    async function deleteSelectedMemory() {
        const checked = document.querySelectorAll('.memory-checkbox:checked');
        const indices = Array.from(checked).map(cb => parseInt(cb.value));
        cloudData.shopInventory = cloudData.shopInventory.filter((_, idx) => !indices.includes(idx));
        await saveCloud();
        openMemoryModal();
    }

    function openCardNumbersModal() {
        const list = document.getElementById('cardListContainer');
        list.innerHTML = '';
        (cloudData.registeredCards || []).forEach((card, idx) => {
            list.innerHTML += `<li style="padding: 8px;"><input type="checkbox" class="card-checkbox" value="${idx}" id="c_${idx}"><label for="c_${idx}"> Card: <strong>${card}</strong></label></li>`;
        });
        document.getElementById('cardNumbersModal').style.display = 'block';
    }
    function closeCardNumbersModal() { document.getElementById('cardNumbersModal').style.display = 'none'; }
    async function deleteSelectedCards() {
        const checked = document.querySelectorAll('.card-checkbox:checked');
        const indices = Array.from(checked).map(cb => parseInt(cb.value));
        cloudData.registeredCards = cloudData.registeredCards.filter((_, idx) => !indices.includes(idx));
        await saveCloud();
        openCardNumbersModal();
    }

    function checkCardRequests() {
        if (cloudData.cardApprovalRequest === 'pending' && cloudData.pendingCard) {
            document.getElementById('pendingCardNum').innerText = cloudData.pendingCard;
            document.getElementById('approvalModal').style.display = 'block';
            cloudData.cardApprovalRequest = 'prompted';
            saveCloud();
        }
    }

    async function approveCard() {
        if (!cloudData.registeredCards.includes(cloudData.pendingCard)) {
            cloudData.registeredCards.push(cloudData.pendingCard);
        }
        cloudData.cardStatus = 'approved';
        cloudData.cardApprovalRequest = null;
        document.getElementById('approvalModal').style.display = 'none';
        await saveCloud();
    }

    async function disapproveCard() {
        cloudData.cardStatus = 'disapproved';
        cloudData.cardApprovalRequest = null;
        document.getElementById('approvalModal').style.display = 'none';
        await saveCloud();
    }

    setInterval(fetchCloud, 1500);
    fetchCloud();
</script>
</body>
</html>
